<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin – RoomSetu</title><link rel="stylesheet" href="./krf.css"></head><body>
<main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:8px 0">Admin Panel</h2><button class="krf-btn" id="rf">↻ Refresh</button></div>
<div class="err" id="err"></div><div class="stats" id="st"></div>
<div class="form card" style="padding:12px;margin-bottom:14px"><select id="fs"><option value="">All</option><option value="live">Live</option><option value="expired">Expired</option><option value="removed">Removed</option><option value="pinned">Pinned</option></select><input id="q" placeholder="Search title, area, owner…"></div>
<div id="ls"><div class="skel"></div></div></main>
<script type="module">
import {renderChrome,auth,db,A,F,getRole,esc} from "./app.js";
import {inr,toast} from "./rooms.js";
renderChrome();let L=[],U={};
const dt=x=>x&&x.toDate?x.toDate().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"—";
const exp=l=>!!(l.expiresAt&&l.expiresAt.toMillis&&l.expiresAt.toMillis()<Date.now()),kind=l=>l.status==="rejected"?"removed":exp(l)?"expired":"live";
const LB={live:["Live","approved"],expired:["Expired","closed"],removed:["Removed","rejected"]};
A.onAuthStateChanged(auth,async u=>{if(!u)return location.replace("login.html?next=admin.html");
 if(await getRole(u)!=="admin"){ls.innerHTML='<div class="empty"><b>Access denied</b>Ye page sirf administrator ke liye hai.</div>';return}load()});
async function load(){err.textContent="";ls.innerHTML='<div class="skel"></div>';
 try{L=(await F.getDocs(F.collection(db,"listings"))).docs.map(x=>({id:x.id,...x.data()}));L.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))}
 catch(e){console.error(e);ls.innerHTML="";err.textContent="Listings load nahi hui ["+(e.code||e.message)+"]. "+(e.code==="permission-denied"?"Rules ya admin role check karein.":"");return}
 try{U={};(await F.getDocs(F.collection(db,"users"))).forEach(x=>U[x.id]=x.data())}catch(e){console.warn(e)}draw()}
function draw(){const k=x=>L.filter(l=>kind(l)===x).length,s=fs.value,t=q.value.trim().toLowerCase();
 st.innerHTML=[["Total",L.length],["Live",k("live")],["Expired",k("expired")],["Removed",k("removed")]].map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join("");
 const R=L.filter(l=>(!s||(s==="pinned"?typeof l.featuredRank==="number":kind(l)===s))&&(!t||[l.title,l.area,l.ownerName,l.ownerEmail].join(" ").toLowerCase().includes(t)))
  .sort((a,b)=>(typeof a.featuredRank==="number"?a.featuredRank:99)-(typeof b.featuredRank==="number"?b.featuredRank:99));
 ls.innerHTML=R.length?R.map(l=>{const o=U[l.ownerUid]||{},[lb,cl]=LB[kind(l)];return `<div class="card item">${l.photos&&l.photos[0]?`<a href="${esc(l.photos[0])}" target="_blank" rel="noopener"><img src="${esc(l.photos[0])}" alt=""></a>`:'<div class="ph"></div>'}<div class="info"><b>${esc(l.title)}</b> <span class="st ${cl}">${lb}</span>${typeof l.featuredRank==="number"?` <span class="st approved">Pin #${l.featuredRank}</span>`:""}
 <div class="muted">${esc(l.propertyType||"")} • ${esc(l.area||"")} • ${inr(l.monthlyRent)}/mo • Deposit ${inr(l.securityDeposit)}</div>
 <div class="muted">Owner: ${esc(o.name||l.ownerName||"—")} • ${esc(o.email||l.ownerEmail||"")} • ${esc(o.phone||"")}</div>
 <div class="muted">Posted ${dt(l.createdAt)} • Live till ${dt(l.expiresAt)} • ${(l.photos||[]).length} photo(s)</div>
 <details><summary class="muted">Details</summary><p style="white-space:pre-wrap">${esc(l.description||"")}</p><div class="muted">Facilities: ${esc((l.facilities||[]).join(", ")||"—")}<br>Landmark: ${esc(l.landmark||"—")} • For: ${esc(l.suitableForLabel||"")} • ${esc(l.furnishingLabel||"")}</div></details>
 <div class="acts"><input type="number" min="1" max="365" value="30" id="dy${l.id}" style="width:72px;min-height:38px;border:1.5px solid #e7e1d3;border-radius:10px;padding:0 8px"><button class="krf-btn" data-a="days" data-id="${l.id}">Set days</button>
 <select data-pin="${l.id}" style="min-height:38px;border-radius:10px;border:1.5px solid #e7e1d3"><option value="">Pin: none</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${l.featuredRank===n?"selected":""}>Pin #${n}</option>`).join("")}</select>
 <button class="krf-btn" data-a="${l.status==="rejected"?"restore":"remove"}" data-id="${l.id}">${l.status==="rejected"?"Restore":"Remove"}</button><button class="krf-btn" data-a="delete" data-id="${l.id}">Delete</button></div></div></div>`}).join(""):'<div class="empty"><b>Koi listing nahi mili</b></div>'}
const upd=async(id,data,msg)=>{try{await F.updateDoc(F.doc(db,"listings",id),data);toast(msg);load()}catch(e){console.error(e);toast("Update fail ["+(e.code||"error")+"]")}};
fs.onchange=q.oninput=draw;rf.onclick=load;
ls.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const id=b.dataset.id,a=b.dataset.a;
 if(a==="days"){const n=Math.round(+document.getElementById("dy"+id).value);if(!(n>=1&&n<=365))return toast("1 se 365 din likhein");return upd(id,{expiresAt:F.Timestamp.fromMillis(Date.now()+n*864e5)},"Ab "+n+" din live rahegi")}
 if(a==="remove")return upd(id,{status:"rejected",reviewedAt:F.serverTimestamp()},"Listing hata di gayi");
 if(a==="restore")return upd(id,{status:"approved",reviewedAt:F.serverTimestamp()},"Listing wapas live");
 if(a==="delete"&&confirm("Ye listing hamesha ke liye delete karein?")){try{await F.deleteDoc(F.doc(db,"listings",id));toast("Delete ho gayi");load()}catch(x){console.error(x);toast("Delete fail hua")}}};
ls.onchange=e=>{const s=e.target.closest("[data-pin]");if(!s)return;upd(s.dataset.pin,s.value?{featuredRank:+s.value}:{featuredRank:F.deleteField()},s.value?"Pin #"+s.value+" laga diya":"Pin hata diya")};
</script></body></html>
