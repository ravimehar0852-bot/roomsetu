<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RoomSetu – Rooms in Kota</title><meta name="description" content="Kota mein room, PG aur hostel dhundhein – location se search karein."><meta name="theme-color" content="#0f766e"><link rel="stylesheet" href="./krf.css">
<style>.feed{max-width:560px;margin:0 auto;padding:12px 12px 24px}.sb{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:50;background:#fdf9f1;padding:8px 0}
.sb input{width:100%;min-height:50px;border:1.5px solid #0f766e;border-radius:999px;padding:0 20px;font-size:16px;background:#fff}
.post{margin-bottom:18px}.post .top{display:flex;justify-content:space-between;padding:12px 14px}.imgs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.imgs img,.imgs .ph{flex:none;width:100%;height:300px;object-fit:cover;scroll-snap-align:center;background:#e5ece9}
.act{display:flex;gap:8px;padding:10px 12px 0}.ic{border:0;background:#f1f5f4;border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer}.post .b{padding:8px 14px 14px}.post h3{margin:0}
select.chip{font-family:inherit;font-size:14px}.chip.on{background:#0f766e;color:#fff;border-color:#0f766e}.center{text-align:center;padding:14px}</style></head><body>
<div class="feed"><div class="sb"><input id="loc" type="search" placeholder="Location likhein (jaise Talwandi, Allen ke paas)" enterkeyhint="search" autocomplete="off"></div>
<div class="chips" id="chips" style="margin:6px 0 12px"></div><div id="feed"><div class="skel"></div></div><div id="end" class="muted center"></div>
<footer style="margin-top:10px;padding:14px"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></footer></div>
<script type="module">
import {renderChrome,esc} from "./app.js";
import {authReady,fetchApproved,inr,bindFav,isFav,toast,TYPES} from "./rooms.js";
renderChrome();let ALL=[],list=[],n=0,user=null,type="";const STEP=5,norm=s=>String(s||"").toLowerCase();
const CH=[["","All"],["Single Room","Single"],["Double Sharing","Double"]],rest=TYPES.filter(t=>!CH.some(c=>c[0]===t));
chips.innerHTML=CH.map(([v,t])=>`<button class="chip${v===""?" on":""}" data-t="${esc(v)}">${t}</button>`).join("")+`<select class="chip" id="mt"><option value="">More ▾</option>${rest.map(t=>`<option>${esc(t)}</option>`).join("")}</select>`;
const setType=v=>{type=v;chips.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===v));if(!rest.includes(v))mt.value="";load()};
chips.onclick=e=>{const b=e.target.closest("button");if(b)setType(b.dataset.t)};mt.onchange=()=>mt.value&&setType(mt.value);
const post=l=>{const ph=(l.photos||[]).filter(Boolean);return `<article class="card post"><div class="top"><b>📍 ${esc(l.area||"Kota")}</b><span class="muted">${esc(l.propertyType||"")}</span></div>
<div class="imgs">${ph.length?ph.map(p=>`<img loading="lazy" src="${esc(p)}" alt="${esc(l.title)}">`).join(""):'<div class="ph"></div>'}</div>
<div class="act"><button class="ic" data-fav="${esc(l.id)}">${isFav(l.id)?"♥ Saved":"♡ Save"}</button><button class="ic" data-share="${esc(l.id)}">↗ Share</button></div>
<div class="b"><h3>${esc(l.title)}</h3><div class="rent">${inr(l.monthlyRent)}<span class="muted">/month</span></div><div class="muted">${esc([l.landmark,l.area].filter(Boolean).join(", "))}</div>
<div class="row"><a class="krf-btn fill" href="chat.html?listing=${encodeURIComponent(l.id)}">💬 Chat</a><a class="krf-btn" href="room-details.html?id=${encodeURIComponent(l.id)}">Detail</a></div></div></article>`};
function order(){const q=norm(loc.value).split(/\s+/).filter(Boolean);
 const m=l=>{if(!q.length)return 0;const h=norm([l.area,l.landmark,l.title,l.city].join(" "));return q.every(t=>h.includes(t))?0:1};
 const pin=l=>typeof l.featuredRank==="number"?l.featuredRank:1e9,t=l=>l.createdAt?.seconds||0;
 list=[...ALL].sort((a,b)=>m(a)-m(b)||pin(a)-pin(b)||t(b)-t(a));n=0;feed.innerHTML="";more()}
function more(){const s=list.slice(n,n+STEP);feed.insertAdjacentHTML("beforeend",s.map(post).join(""));n+=s.length;
 end.textContent=!list.length?"":n>=list.length?"Aur listings nahi hain":"Scroll karein…";
 if(!list.length)feed.innerHTML='<div class="empty"><b>Koi room nahi mila</b>Dusri location try karein ya "All" chunein.</div>'}
async function load(){feed.innerHTML='<div class="skel"></div>';try{ALL=await fetchApproved({propertyType:type,max:100});order()}catch(e){console.error(e);feed.innerHTML='<div class="empty"><b>Listings load nahi hui</b>Refresh karein.</div>'}}
new IntersectionObserver(es=>{if(es[0].isIntersecting&&n<list.length)more()},{rootMargin:"300px"}).observe(end);
let tm;loc.oninput=()=>{clearTimeout(tm);tm=setTimeout(order,250)};
bindFav(feed);const base=feed.onclick;
feed.onclick=e=>{base(e);const s=e.target.closest("[data-share]");
 if(s){const l=ALL.find(x=>x.id===s.dataset.share),u=new URL("room-details.html?id="+encodeURIComponent(l.id),location.href).href;
  navigator.share?navigator.share({title:l.title,url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>toast("Link copy ho gaya"))}};
authReady().then(u=>{user=u;load()});
</script></body></html>
