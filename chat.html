<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chats – RoomSetu</title><link rel="stylesheet" href="./krf.css">
<style>.chatbox{display:flex;flex-direction:column;height:calc(100dvh - 170px);min-height:320px}.ch{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ms{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:#fff;border-radius:16px}
.m{max-width:78%;background:#f1f5f4;border-radius:14px;padding:8px 12px;align-self:flex-start;white-space:pre-wrap;word-break:break-word}.m.me{align-self:flex-end;background:#0f766e;color:#fff}.m small{display:block;opacity:.7;font-size:10px}
.mf{display:flex;gap:8px;margin-top:8px}.mf input{flex:1;min-height:46px;border-radius:12px;border:1.5px solid #e7e1d3;padding:0 12px;font-size:16px}</style></head><body>
<main class="wrap" style="max-width:640px" id="root"><div class="skel"></div></main>
<script type="module">
import {renderChrome,auth,db,A,F,esc} from "./app.js";
renderChrome();const q=new URLSearchParams(location.search);let uid;
const T=x=>x&&x.toDate?x.toDate().toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const bad=(t,m="")=>root.innerHTML=`<div class="empty"><b>${t}</b>${m}<br><br><a class="krf-btn fill" href="chat.html">Meri chats</a></div>`;
A.onAuthStateChanged(auth,u=>{if(!u)return location.replace("login.html?next="+encodeURIComponent("chat.html"+location.search));uid=u.uid;
 q.get("listing")?start(u,q.get("listing")):q.get("c")?openChat(q.get("c")):inbox()});
async function start(u,lid){try{const ls=await F.getDoc(F.doc(db,"listings",lid));if(!ls.exists())throw 0;const l=ls.data();
 if(l.ownerUid===uid)return bad("Ye aapki apni property hai");
 const id=lid+"_"+uid,ref=F.doc(db,"chats",id);
 if(!(await F.getDoc(ref)).exists())await F.setDoc(ref,{listingId:lid,listingTitle:String(l.title||"").slice(0,150),ownerUid:l.ownerUid,ownerName:l.ownerName||"Owner",customerUid:uid,customerName:u.displayName||"Customer",participants:[l.ownerUid,uid],lastMessage:"",lastMessageAt:F.serverTimestamp(),createdAt:F.serverTimestamp()});
 location.replace("chat.html?c="+encodeURIComponent(id))}catch(e){console.error(e);bad("Chat shuru nahi ho paya","Property ab available nahi hai ya dobara try karein.")}}
const other=c=>c.ownerUid===uid?c.customerName:c.ownerName;
async function inbox(){root.innerHTML='<h2 style="margin-top:8px">Chats</h2><div id="il"><div class="skel"></div></div>';
 try{const C=(await F.getDocs(F.query(F.collection(db,"chats"),F.where("participants","array-contains",uid)))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.lastMessageAt?.seconds||0)-(a.lastMessageAt?.seconds||0));
 il.innerHTML=C.length?C.map(c=>`<a class="card item" style="text-decoration:none" href="chat.html?c=${encodeURIComponent(c.id)}"><div class="info"><b>${esc(other(c))}</b> <span class="muted">• ${esc(c.listingTitle)}</span><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.lastMessage||"Message bhejein…")}</div></div><span class="muted">${T(c.lastMessageAt)}</span></a>`).join(""):'<div class="empty"><b>Abhi koi chat nahi</b>Kisi room par Chat dabayein.<br><br><a class="krf-btn fill" href="index.html">Rooms dekhein</a></div>'}
 catch(e){console.error(e);il.innerHTML='<div class="empty"><b>Chats load nahi hui</b>Refresh karein.</div>'}}
async function openChat(id){let c;try{const s=await F.getDoc(F.doc(db,"chats",id));if(!s.exists())throw 0;c=s.data()}catch{return bad("Chat nahi mili")}
 root.innerHTML=`<div class="chatbox"><div class="ch"><a href="chat.html" class="krf-btn" style="min-height:38px">←</a><div style="min-width:0"><b>${esc(other(c))}</b><div class="muted">${esc(c.listingTitle)}</div></div></div><div id="ms" class="ms"></div><form id="mf" class="mf"><input id="mi" maxlength="1000" placeholder="Message likhein…" autocomplete="off"><button class="krf-btn fill">Bhejein</button></form></div>`;
 F.onSnapshot(F.query(F.collection(db,"chats",id,"messages"),F.orderBy("createdAt")),s=>{ms.innerHTML=s.docs.length?s.docs.map(d=>{const m=d.data();return `<div class="m ${m.senderUid===uid?"me":""}">${esc(m.text)}<small>${T(m.createdAt)}</small></div>`}).join(""):'<div class="muted" style="margin:auto">Pehla message bhejein 👋</div>';ms.scrollTop=ms.scrollHeight},e=>console.error(e));
 mf.onsubmit=async e=>{e.preventDefault();const t=mi.value.trim();if(!t)return;mi.value="";
  try{await F.addDoc(F.collection(db,"chats",id,"messages"),{senderUid:uid,text:t,createdAt:F.serverTimestamp()});await F.updateDoc(F.doc(db,"chats",id),{lastMessage:t.slice(0,120),lastMessageAt:F.serverTimestamp()})}catch(x){console.error(x);mi.value=t}}}
</script></body></html>
