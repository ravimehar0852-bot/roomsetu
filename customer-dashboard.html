<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Enquiries – Kota Room Finder</title><link rel="stylesheet" href="./krf.css"></head><body>
<main class="wrap"><h2 style="margin-top:8px">My Enquiries</h2><div id="es"><div class="skel"></div></div>
<h2>My Profile</h2><form id="pf" class="card box f" style="margin:0 0 20px;max-width:460px"><label>Name<input name="name" required></label><label>Mobile<input name="phone" type="tel" inputmode="numeric" maxlength="10"></label><label>Email<input name="email" disabled></label><div class="err" id="pe"></div><button class="krf-btn fill">Save profile</button></form>
<div class="row" style="max-width:460px"><a class="krf-btn" href="rooms.html?saved=1">♥ Saved rooms</a><a class="krf-btn" href="rooms.html">Find rooms</a></div></main>
<script type="module">
import {renderChrome,auth,db,A,F,getRole,esc} from "./app.js";
import {toast} from "./rooms.js";
renderChrome();
A.onAuthStateChanged(auth,async u=>{if(!u)return location.replace("login.html?next=customer-dashboard.html");
 const r=await getRole(u);if(r==="admin")return location.replace("admin.html");
 let ud={};try{ud=(await F.getDoc(F.doc(db,"users",u.uid))).data()||{}}catch{}
 pf.name.value=ud.name||u.displayName||"";pf.phone.value=ud.phone||"";pf.email.value=u.email||"";
 pf.onsubmit=async e=>{e.preventDefault();pe.textContent="";const n=pf.name.value.trim(),p=pf.phone.value.trim();
  if(n.length<2)return pe.textContent="Naam likhein.";if(p&&!/^[6-9]\d{9}$/.test(p))return pe.textContent="Sahi 10 digit number likhein.";
  try{await F.updateDoc(F.doc(db,"users",u.uid),{name:n,phone:p});await A.updateProfile(u,{displayName:n});toast("Profile save ho gayi")}catch(x){console.error(x);pe.textContent="Save nahi hua."}};
 try{const E=(await F.getDocs(F.query(F.collection(db,"enquiries"),F.where("customerUid","==",u.uid)))).docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  es.innerHTML=E.length?E.map(e=>`<div class="card item"><div class="info"><b>${esc(e.listingTitle||"Property")}</b> <span class="st ${esc(e.status)}">${esc(e.status)}</span><div class="muted">${e.createdAt?e.createdAt.toDate().toLocaleDateString("en-IN"):""}</div><p style="margin:6px 0">${esc(e.message)}</p><a href="room-details.html?id=${encodeURIComponent(e.listingId)}" style="color:#0f766e;font-weight:700">Property dekhein →</a></div></div>`).join(""):'<div class="empty"><b>Abhi koi enquiry nahi</b><a class="krf-btn fill" href="rooms.html">Rooms dekhein</a></div>'}
 catch(x){console.error(x);es.innerHTML='<div class="empty"><b>Enquiries load nahi hui</b>Refresh karein.</div>'}});
</script></body></html>
