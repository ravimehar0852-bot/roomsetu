<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner Dashboard – Kota Room Finder</title><link rel="stylesheet" href="./krf.css"></head><body>
<main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:8px 0">Owner Dashboard</h2><a class="krf-btn fill" href="join.html">+ New listing</a></div>
<div class="stats" id="st"></div><div class="err" id="err"></div>
<h2>My Properties</h2><div id="ls"><div class="skel"></div></div><h2>Enquiries Received</h2><div id="es"></div></main>
<script type="module">
import {renderChrome,auth,db,storage,A,F,S,getRole,esc} from "./app.js";
import {inr,toast} from "./rooms.js";
renderChrome();let uid,L=[];
const ok=["image/jpeg","image/png","image/webp"],d=x=>x&&x.toDate?x.toDate().toLocaleDateString("en-IN"):"";
A.onAuthStateChanged(auth,async u=>{if(!u)return location.replace("login.html?next=owner-dashboard.html");
 const r=await getRole(u);if(r==="admin")return location.replace("admin.html");if(r!=="owner")return location.replace("customer-dashboard.html");uid=u.uid;load()});
async function load(){err.textContent="";
 try{const s=await F.getDocs(F.query(F.collection(db,"listings"),F.where("ownerUid","==",uid)));L=s.docs.map(x=>({id:x.id,...x.data()}));
  const c=k=>L.filter(x=>x.status===k).length;let E=[];
  try{E=(await F.getDocs(F.query(F.collection(db,"enquiries"),F.where("ownerUid","==",uid)))).docs.map(x=>({id:x.id,...x.data()}))}catch(e){console.warn(e)}
  st.innerHTML=[["Total",L.length],["Live",c("approved")],["Removed",c("rejected")],["Enquiries",E.length]].map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join("");
  ls.innerHTML=L.length?L.map(card).join(""):'<div class="empty"><b>Abhi koi listing nahi</b><a class="krf-btn fill" href="join.html">Pehli property list karein</a></div>';
  E.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  es.innerHTML=E.length?E.map(e=>`<div class="card item"><div class="info"><b>${esc(e.customerName)}</b> <span class="st ${esc(e.status)}">${esc(e.status)}</span><div class="muted">${esc(e.listingTitle||"")} • ${d(e.createdAt)}</div><p style="margin:6px 0">${esc(e.message)}</p>${e.customerContact?`<a href="tel:${esc(e.customerContact)}" style="color:#0f766e;font-weight:700">📞 ${esc(e.customerContact)}</a>`:""}
   <div class="acts">${["new","contacted","closed"].filter(x=>x!==e.status).map(x=>`<button class="krf-btn" data-eq="${e.id}" data-v="${x}">Mark ${x}</button>`).join("")}</div></div></div>`).join(""):'<div class="empty">Abhi koi enquiry nahi aayi.</div>'}
 catch(e){console.error(e);ls.innerHTML="";err.textContent="Data load nahi ho paya. Refresh karein."}}
const card=l=>`<div class="card item">${l.photos&&l.photos[0]?`<img src="${esc(l.photos[0])}" alt="">`:'<div class="ph"></div>'}<div class="info"><b>${esc(l.title)}</b> <span class="st ${esc(l.status)}">${esc(l.status)}</span>
 <div class="muted">${esc(l.area||"")} • ${inr(l.monthlyRent)}/mo • ${l.availability==="available"?"Available":"Not available"}${l.expiresAt?" • Live till "+d(l.expiresAt):""}</div>
 ${l.status==="rejected"?'<div class="err">Admin ne is listing ko hata diya hai.</div>':""}
 <div class="acts"><button class="krf-btn" data-av="${l.id}">${l.availability==="available"?"Mark unavailable":"Mark available"}</button><button class="krf-btn" data-ed="${l.id}">Edit</button>${(l.photos||[]).length<8?`<label class="krf-btn" style="cursor:pointer">+ Photos<input type="file" hidden multiple accept="image/jpeg,image/png,image/webp" data-ph="${l.id}"></label>`:""}</div>
 <form class="f" id="ed${l.id}" hidden style="margin-top:10px"><div class="two"><label>Rent ₹<input name="r" type="number" min="1" value="${+l.monthlyRent||""}"></label><label>Deposit ₹<input name="d" type="number" min="0" value="${l.securityDeposit??0}"></label></div><label>Description<textarea name="t">${esc(l.description||"")}</textarea></label><button class="krf-btn fill">Save changes</button></form></div></div>`;
document.addEventListener("click",async e=>{const t=e.target,id=k=>t.dataset[k];
 try{if(id("av")){const l=L.find(x=>x.id===id("av"));await F.updateDoc(F.doc(db,"listings",l.id),{availability:l.availability==="available"?"unavailable":"available"});load()}
 else if(id("ed"))document.getElementById("ed"+id("ed")).hidden^=1;
 else if(id("eq")){await F.updateDoc(F.doc(db,"enquiries",id("eq")),{status:id("v"),updatedAt:F.serverTimestamp()});load()}}catch(x){console.error(x);toast("Update nahi ho paya")}});
document.addEventListener("submit",async e=>{const f=e.target;if(!f.id.startsWith("ed"))return;e.preventDefault();const id=f.id.slice(2),r=+f.r.value,dp=+f.d.value,t=f.t.value.trim();
 if(!(r>0)||!(dp>=0)||t.length<10)return toast("Rent, deposit aur description sahi bharein");
 try{await F.updateDoc(F.doc(db,"listings",id),{monthlyRent:r,securityDeposit:dp,description:t});toast("Saved");load()}catch(x){console.error(x);toast("Save nahi hua")}});
document.addEventListener("change",async e=>{const i=e.target;if(!i.dataset.ph)return;const l=L.find(x=>x.id===i.dataset.ph),fs=[...i.files],cur=l.photos||[];
 if(cur.length+fs.length>8)return toast("Maximum 8 photos");for(const x of fs)if(!ok.includes(x.type)||x.size>=5*1024*1024)return toast("Sirf JPG/PNG/WebP, 5 MB tak");
 toast("Upload ho rahi hain…");try{const u=[...cur];for(let k=0;k<fs.length;k++){const r=S.ref(storage,`listings/${uid}/${l.id}/${Date.now()}_${k}.${fs[k].type.split("/")[1]}`);await S.uploadBytes(r,fs[k],{contentType:fs[k].type});u.push(await S.getDownloadURL(r))}
 await F.updateDoc(F.doc(db,"listings",l.id),{photos:u});toast("Photos add ho gayi");load()}catch(x){console.error(x);toast("Upload fail hua")}});
</script></body></html>
