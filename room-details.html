<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Room Details – Kota Room Finder</title><link rel="stylesheet" href="./krf.css"></head><body>
<main class="wrap" id="m"><div class="skel"></div></main>
<script type="module">
import {renderChrome,auth,db,F,esc} from "./app.js";
import {authReady,inr,toast} from "./rooms.js";
renderChrome();const id=new URLSearchParams(location.search).get("id");
const bad=t=>m.innerHTML=`<div class="empty"><b>${t}</b><a class="krf-btn fill" href="rooms.html">Rooms dekhein</a></div>`;
const fact=(k,v)=>v?`<div><small>${k}</small>${esc(v)}</div>`:"";
(async()=>{const user=await authReady();if(!id)return bad("Property nahi mili");
 let l;try{const s=await F.getDoc(F.doc(db,"listings",id));if(!s.exists())return bad("Property nahi mili ya ab available nahi hai");l=s.data()}
 catch(e){console.error(e);return bad("Property nahi mili ya ab available nahi hai")}
 document.title=l.title+" – Kota Room Finder";const ph=(l.photos||[]).filter(Boolean);
 const fac=Array.isArray(l.facilities)?l.facilities:[];
 m.innerHTML=`<div class="gal">${ph.length?`<img class="main" id="mainImg" src="${esc(ph[0])}" alt="${esc(l.title)}"><div class="thumbs">${ph.map((p,i)=>`<img src="${esc(p)}" data-i="${i}" alt="Photo ${i+1}">`).join("")}</div>`:`<div class="skel" style="animation:none;height:200px"></div>`}</div>
 <h2 style="margin-bottom:4px">${esc(l.title)}</h2><div class="muted">${esc([l.landmark,l.area,l.city].filter(Boolean).join(", "))}</div>
 <div class="rent" style="margin-top:8px">${inr(l.monthlyRent)}<span class="muted"> /month</span></div>
 <div class="facts">${fact("Security deposit",l.securityDeposit!=null?inr(l.securityDeposit):"")}${fact("Property type",l.propertyType)}${fact("Suitable for",l.suitableForLabel||l.suitableFor)}${fact("Furnishing",l.furnishingLabel||l.furnishing)}${fact("Available from",l.availableFrom)}${fact("Status",l.availability==="available"?"Available":"Not available")}</div>
 ${fac.length?`<h2>Facilities</h2><div>${fac.map(x=>`<span class="tag">${esc(x)}</span>`).join(" ")}</div>`:""}
 ${l.description?`<h2>Description</h2><p style="white-space:pre-wrap">${esc(l.description)}</p>`:""}
 <div class="row" style="max-width:420px"><button class="krf-btn" id="fav">♡ Save</button></div>
 <div class="card box wide" style="margin:22px 0" id="eq"></div>`;
 m.querySelectorAll("[data-i]").forEach(t=>t.onclick=()=>mainImg.src=ph[t.dataset.i]);
 const eq=document.getElementById("eq"),back=encodeURIComponent("room-details.html?id="+id);
 const favRef=user&&F.doc(db,"favorites",user.uid+"_"+id);let saved=false;
 if(user)try{saved=(await F.getDoc(favRef)).exists();fav.textContent=saved?"♥ Saved":"♡ Save"}catch{}
 fav.onclick=async()=>{if(!user){location.href="login.html?next="+back;return}
  try{if(saved){await F.deleteDoc(favRef)}else{await F.setDoc(favRef,{uid:user.uid,listingId:id,createdAt:F.serverTimestamp()})}saved=!saved;fav.textContent=saved?"♥ Saved":"♡ Save"}catch{toast("Save nahi ho paya")}};
 eq.innerHTML=`<h2 style="margin-top:0">Owner ko enquiry bhejein</h2><p class="muted">Owner ka contact number public nahi dikhaya jata. Enquiry bhejne par owner aapse sampark karega.</p>`;
 if(!user){eq.innerHTML+=`<a class="krf-btn fill" href="login.html?next=${back}">Enquiry ke liye login karein</a>`;return}
 if(user.uid===l.ownerUid){eq.innerHTML+=`<p class="muted">Ye aapki apni property hai.</p>`;return}
 try{const d=await F.getDocs(F.query(F.collection(db,"enquiries"),F.where("customerUid","==",user.uid),F.where("listingId","==",id),F.limit(1)));
  if(!d.empty){eq.innerHTML+=`<p class="ok">✓ Aap is property ke liye enquiry bhej chuke hain. Status Enquiries tab mein dekhein.</p>`;return}}catch(e){console.warn(e)}
 eq.insertAdjacentHTML("beforeend",`<form id="ef" class="f"><label>Aapka naam<input name="name" value="${esc(user.displayName||"")}" required></label><label>Mobile number<input name="contact" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit number" required></label><label>Message<textarea name="msg" maxlength="1000" required>Hi, mujhe is room mein interest hai. Kya main visit kar sakta/sakti hoon?</textarea></label><div class="err" id="ee" role="alert"></div><button class="krf-btn fill" id="eb" type="submit">Enquiry bhejein</button></form>`);
 ef.onsubmit=async e=>{e.preventDefault();ee.textContent="";const n=ef.name.value.trim(),c=ef.contact.value.trim(),t=ef.msg.value.trim();
  if(n.length<2)return ee.textContent="Naam likhein.";if(!/^[6-9]\d{9}$/.test(c))return ee.textContent="Sahi 10 digit mobile number likhein.";if(t.length<5)return ee.textContent="Message thoda detail mein likhein.";
  eb.disabled=true;eb.textContent="Bhej rahe hain…";
  try{await F.addDoc(F.collection(db,"enquiries"),{listingId:id,listingTitle:String(l.title||"").slice(0,150),ownerUid:l.ownerUid,customerUid:user.uid,customerName:n,customerContact:c,message:t,status:"new",createdAt:F.serverTimestamp()});
   ef.replaceWith(Object.assign(document.createElement("p"),{className:"ok",textContent:"✓ Enquiry bhej di gayi! Owner jaldi sampark karega."}))}
  catch(x){console.error(x);ee.textContent="Enquiry nahi ja payi. Dobara try karein.";eb.disabled=false;eb.textContent="Enquiry bhejein"}};
})();
</script></body></html>
