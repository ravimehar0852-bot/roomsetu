<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Contact Us – Kota Room Finder</title><link rel="stylesheet" href="./krf.css"></head><body>
<main class="wrap"><div class="card box"><h2 style="margin-top:0">Contact Us</h2><p class="muted">Koi sawal ya problem? Hume message bhejein.</p>
<div id="ways" class="row" style="flex-wrap:wrap;margin-bottom:14px"></div>
<form id="cf" class="f" novalidate><label>Aapka naam<input name="name" required></label><label>Message<textarea name="msg" maxlength="1000" required></textarea></label><div class="err" id="err" role="alert"></div><button class="krf-btn fill" type="submit">Email bhejein</button><p class="muted">Ye button aapke email app mein message khol dega.</p></form></div></main>
<footer><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></footer>
<script type="module">
import {renderChrome,esc} from "./app.js";import {SITE} from "./site.js";renderChrome();
const w=[];if(SITE.phone)w.push(`<a class="krf-btn" href="tel:${esc(SITE.phone)}">📞 Call</a>`);if(SITE.whatsapp)w.push(`<a class="krf-btn" href="https://wa.me/${esc(SITE.whatsapp)}" rel="noopener">WhatsApp</a>`);ways.innerHTML=w.join("");
cf.onsubmit=e=>{e.preventDefault();err.textContent="";const n=cf.name.value.trim(),m=cf.msg.value.trim();if(n.length<2||m.length<5)return err.textContent="Naam aur message likhein.";
 location.href=`mailto:${SITE.email}?subject=${encodeURIComponent("Kota Room Finder enquiry from "+n)}&body=${encodeURIComponent(m)}`};
</script></body></html>
