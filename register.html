<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Register – Kota Room Finder</title><link rel="stylesheet" href="./krf.css"></head><body>
<main class="wrap"><div class="card box"><h2 style="margin-top:0">Create account</h2>
<form id="rf" class="f" novalidate>
<label>Main kaun hoon<select name="role"><option value="customer">Student / Tenant – room dhundh raha hoon</option><option value="owner">Property Owner – room list karna hai</option></select></label>
<label>Full name<input name="name" autocomplete="name" required></label>
<label>Email<input name="email" type="email" autocomplete="email" required></label>
<label>Mobile number<input name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 digit number"></label>
<label>Password<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
<div class="err" id="err" role="alert"></div><button class="krf-btn fill" id="go" type="submit">Register</button>
<p class="muted" style="text-align:center">Pehle se account hai? <a href="login.html" style="color:#0f766e;font-weight:700">Login</a></p></form></div></main>
<script type="module">
import {renderChrome,auth,db,A,F,home,safeNext,authMsg,isAdminEmail} from "./app.js";
renderChrome();const f=rf,q=new URLSearchParams(location.search).get("next");
f.onsubmit=async e=>{e.preventDefault();err.textContent="";
 const name=f.name.value.trim(),email=f.email.value.trim(),phone=f.phone.value.trim(),pw=f.password.value,role=f.role.value;
 if(name.length<2)return err.textContent="Apna naam likhein.";
 if(!/^\S+@\S+\.\S+$/.test(email))return err.textContent="Sahi email likhein.";
 if(phone&&!/^[6-9]\d{9}$/.test(phone))return err.textContent="10 digit ka sahi mobile number likhein.";
 if(role==="owner"&&!phone)return err.textContent="Owner ke liye mobile number zaroori hai.";
 if(pw.length<6)return err.textContent="Password kam se kam 6 characters ka rakhein.";
 go.disabled=true;go.textContent="Creating…";let step="auth";
 try{const c=await A.createUserWithEmailAndPassword(auth,email,pw);step="profile";
  await A.updateProfile(c.user,{displayName:name});
  await F.setDoc(F.doc(db,"users",c.user.uid),{uid:c.user.uid,name,email,phone,role,createdAt:F.serverTimestamp()});
  location.replace(isAdminEmail(c.user)?"admin.html":safeNext(q,home(role)))}
 catch(x){console.error(x);err.textContent=step==="auth"?authMsg(x):"Account ban gaya par profile save nahi hui. Login karke dobara try karein.";go.disabled=false;go.textContent="Register"}};
</script></body></html>
